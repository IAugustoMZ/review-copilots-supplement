# Search configuration: connector settings + the shared GenAI/domain blocks and the
# CE1-CE14 chemical/process-engineering theme blocks. See
# docs/TECHNICAL_IMPLEMENTATION_PLAN.md sections 3-4.
#
# IMPORTANT scope note: none of Crossref/OpenAlex/Semantic Scholar's free-text
# search parameters support real Boolean AND/OR/NOT grammar the way Scopus or
# ScienceDirect do -- they are relevance-ranked bag-of-words search. The
# genai_block/domain_block/theme_block below are therefore used two ways:
#   1. concatenated into one relevance-query string sent to each connector
#      (query_builder.render_query_string), to steer the API's ranking; and
#   2. enforced client-side as genai AND domain (query_builder.matches_genai_domain)
#      -- this, not the API's ranking, is what actually decides D0 membership.
# The theme_block is NOT required for D0 membership (query_builder.matches_family,
# the strict genai+domain+theme test, exists only for diagnostics/precision
# reporting). D0 is deliberately a broad discovery pool -- narrowing to what's
# actually relevant is AI/human screening's job (Phase 10/11), not this filter's.
# default_rows=200 is OpenAlex's hard per-page ceiling (the binding constraint
# across connectors); Crossref/Semantic Scholar clamp independently in their own
# connector modules to their own, different, hard caps.

connectors:
  contact_email_env: "REVIEW_PIPELINE_CONTACT_EMAIL"
  semantic_scholar_api_key_env: "SEMANTIC_SCHOLAR_API_KEY"
  default_rows: 200
  # Primary temporal scope per CLAUDE.md invariant #3 (2023+; pre-2023 handled
  # separately for foundational concepts, not via this default filter).
  from_year: 2023

genai_block:
  - "large language model"
  - "LLM"
  - "generative AI"
  - "generative artificial intelligence"
  - "foundation model"
  - "AI agent"
  - "LLM agent"
  - "agentic AI"
  - "copilot"
  - "intelligent assistant"
  - "retrieval augmented generation"
  - "RAG"

domain_block:
  - "chemical engineering"
  - "process engineering"
  - "process systems engineering"
  - "PSE"
  - "CAPE"
  - "chemical process"
  - "process industry"
  - "process industries"
  - "chemical plant"
  - "process plant"
  - "petrochemical"
  - "refinery"
  - "bioprocess"
  - "pharmaceutical manufacturing"
  # Added 2026-08-30. The review's declared scope is chemical, process AND
  # manufacturing engineering (CLAUDE.md), but the domain block carried no
  # general manufacturing term, so the client-side genai AND domain test that
  # decides D0 membership was narrower than the review itself. Every CE family
  # is re-run under the widened block as iteration 4; see
  # docs/SEARCH_AND_SNOWBALLING.md Decision 7.1.
  - "manufacturing"
  - "industrial automation"
  - "smart manufacturing"
  - "process manufacturing"
  - "industrial process"
  - "shop floor"
  - "plant operations"
  # Added 2026-08-30 (D-26 revised). The domain block carried no maintenance or
  # asset-integrity vocabulary, so an LLM/agentic paper about predictive
  # maintenance of industrial equipment failed the client-side genai AND domain
  # test that decides D0 membership unless it happened to say "manufacturing".
  # Maintenance and asset health are RQ3 application domains for industrial
  # copilots, so this was a scope hole, not a deliberate boundary.
  - "predictive maintenance"
  - "condition monitoring"
  - "prognostics and health management"
  - "asset integrity"
  - "industrial equipment"
  - "rotating machinery"
  - "fault diagnosis"


  # CE16-CE18 added 2026-08-30, targeting the thesis's own contribution: the
  # construction of a benchmark generator for training industrial copilots. A
  # review that argues such a generator does not yet exist has to have searched
  # for what would refute that claim; CE15 retrieves benchmark *datasets*, these
  # three retrieve benchmark *generation*, the data that would train on them,
  # and the environments they would run in. See docs/SEARCH_AND_SNOWBALLING.md
  # Decision 7.2.
  CE16:
    theme_label: "Benchmark Generation / Task Synthesis for Industrial Agents"
    theme_block:

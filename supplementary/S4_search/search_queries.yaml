  # CE19 added 2026-08-30 (D-26 revised). CE15-CE18 target benchmarks and their
  # construction; CE19 targets the copilot literature in the maintenance and
  # asset-health application domain, which the review's RQ3 covers but which no
  # family named. This is deliberately about copilots applied to maintenance --
  # NOT about pre-LLM PHM benchmark datasets (C-MAPSS, CWRU, MIMII), which are
  # out of scope and are structurally excluded by the genai AND domain test.
  CE19:
    theme_label: "Copilots and Agents for Maintenance, Diagnostics and Asset Health"
    theme_block:
